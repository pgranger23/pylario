[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pylario"
version = "0.1.0"
description = "Pure-Python reader and data model for art-ROOT (LArSoft) event files: reads directly with uproot, no ROOT/art/LArSoft needed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "uproot>=5.0",
]

[project.optional-dependencies]
xrootd = ["fsspec-xrootd>=0.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pylario*"]

[tool.setuptools.package-data]
pylario = ["geom/*.npz"]
